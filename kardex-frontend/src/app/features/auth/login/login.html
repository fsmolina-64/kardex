    <div class="login-container">
      <div class="login-card">
<div class="login-header">
  <img src="karvo.png" alt="KARVO" class="logo-img" />
  <div class="logo-text">KAR<span>VO</span></div>
  <p>Ingresa tus credenciales para continuar</p>
</div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Correo electrónico</mat-label>
            <input matInput formControlName="email" type="email">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="form.get('email')?.hasError('required')">Email requerido</mat-error>
            <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="form.get('password')?.hasError('required')">Contraseña requerida</mat-error>
          </mat-form-field>
          <div class="error-message" *ngIf="errorMessage">
            <mat-icon>error</mat-icon>{{ errorMessage }}
          </div>
          <button mat-raised-button color="primary" type="submit" class="full-width login-btn" [disabled]="loading">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <span *ngIf="!loading">Iniciar Sesión</span>
          </button>
        </form>
      </div>
    </div>
