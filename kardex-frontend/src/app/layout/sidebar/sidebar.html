    <div class="sidebar" [class.collapsed]="collapsed">
<div class="sidebar-header">
        <img
          class="logo-icon"
          src="karvo.png"
          alt="KARVO"
        />
        <span class="logo-text" *ngIf="!collapsed">KAR<span>VO</span></span>
      </div>

      <nav class="sidebar-nav">
        <ng-container *ngFor="let item of menuItems">
          <ng-container *ngIf="canShow(item)">

            <div *ngIf="!item.children"
              class="nav-item"
              [class.active]="isActive(item.route)"
              (click)="navigate(item.route)">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span *ngIf="!collapsed">{{ item.label }}</span>
            </div>

            <div *ngIf="item.children">
              <div class="nav-item nav-parent" (click)="toggleMenu(item)">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span *ngIf="!collapsed">{{ item.label }}</span>
                <mat-icon *ngIf="!collapsed" class="arrow">
                  {{ item.expanded ? 'expand_less' : 'expand_more' }}
                </mat-icon>
              </div>
              <div class="submenu" *ngIf="item.expanded && !collapsed">
                <ng-container *ngFor="let child of item.children">
                  <div *ngIf="canShow(child)"
                    class="nav-item child"
                    [class.active]="isActive(child.route)"
                    (click)="navigate(child.route)">
                    <mat-icon>{{ child.icon }}</mat-icon>
                    <span>{{ child.label }}</span>
                  </div>
                </ng-container>
              </div>
            </div>

          </ng-container>
        </ng-container>
      </nav>

      <div class="sidebar-footer" *ngIf="!collapsed">
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>
          <div>
            <div class="user-name">{{ authService.currentUser()?.fullName }}</div>
            <div class="user-role">{{ getRoleLabel() }}</div>
          </div>
        </div>
        <button class="logout-btn" (click)="authService.logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
